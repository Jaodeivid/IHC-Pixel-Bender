<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Codeforces: practica problemas de programación paso a paso."
    />
    <title>Codeforces</title>
    <script>
      // Aplica las preferencias antes de pintar, para evitar parpadeos.
      ;(function () {
        try {
          var d = document.documentElement.dataset
          var t = localStorage.getItem('tema')
          if (t !== 'dark' && t !== 'light')
            t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
          d.theme = t
          var p = JSON.parse(localStorage.getItem('prefs') || '{}')
          d.daltonismo = p.daltonismo === 'on' ? 'on' : 'off'
          d.texto = p.texto || 'normal'
          d.movimiento = p.movimiento || 'normal'
        } catch (e) {}
      })()
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Sora:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/login.css" />
    <link rel="stylesheet" href="css/accesibilidad.css" />
    <link rel="stylesheet" href="css/pantallas.css" />
    <link rel="stylesheet" href="css/componentes/rutaGuiada.css" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="js/main.js"></script>
  </body>
</html>
